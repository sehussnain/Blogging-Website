name: pull request validation

on: 
  pull_request:
    branches: 
      - develop

jobs:
#lint joob type I am doing 
  lint:
    # Rename the job
    name: HTML and CSS files 
    runs-on: ubuntu-latest
    #Step 1 checking code 
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4

      #step 2 install node module 
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      #Step 3 Install dependencies on task 
      - name: lint dependencies
        run: npm install -g htmlhint stylelint stylelint-config-standard

      #Step 4  creating html config file 
      - name: Create html config file
        run: |
          echo '{
            "tagname-lowercase": true,
            "attr-lowercase": true,
            "alt-require": true,
            "id-unique": true,
            "tag-pair": true
          }' > .htmlhintrc

      #Step 5 html link 
      - name: Html file linking
        run: htmlhint ./**/*.html

      #Step 6 css linking
      - name: Create Stylelint config
        run: |
          echo '{
            "rules": {
              "declaration-block-no-duplicate-properties": true,
              "no-duplicate-selectors": true,
              "property-case": "lower",
              "value-keyword-case": "lower",
              "selector-type-case": "lower",
              "block-no-empty": true
            }
          }' > stylelint.config.json

      #Step 7 css linking
      - name: Lint CSS files
        run: stylelint "styles/**/*.css"

  build:
    # your next job here (can be added below)
    name: Build website using Parcel
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Parcel
        run: npm install -g parcel

      - name: Build static site with Parcel
        run: parcel build src/index.html --dist-dir dist --no-source-maps